name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 单元测试（core/io/officewrite/webref/restore）
        run: |
          node tests/core.test.js
          node tests/msoffice.test.js
          node tests/officewrite.test.js
          node tests/webref.test.js
          node tests/restore.test.js
      - name: 规模基准
        run: node tests/bench.js
