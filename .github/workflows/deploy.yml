name: Deploy Pages
# 仅在 CI 全部通过后部署，避免测试失败的提交上线
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 只发布站点运行所需文件（index.html 及其加载的 css/、js/，外加示例数据 sample/），
      # 不把 tests/、scripts/、docs/、.github/ 等仓库内容上线
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js sample _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
